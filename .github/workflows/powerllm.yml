name: CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
        home-assistant: ['2026.10.0', 'latest']

    steps:
    - uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        version: 1.0
        packages: ffmpeg
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Constrain the minimum Home Assistant test environment
      if: matrix.home-assistant == '2026.10.0'
      run: echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/requirements_test_minimum.txt" >> "$GITHUB_ENV"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox tox-gh-actions
    - name: Test with tox
      run: tox $(test "$RUNNER_DEBUG" && echo "-vv -- -vv")
    - name: Coveralls
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel: true
        flag-name: ${{ matrix.python-version }}-${{ matrix.home-assistant }}

  coverage:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Coverage
      uses: AndreMiras/coveralls-python-action@develop
      with:
        parallel-finished: true
